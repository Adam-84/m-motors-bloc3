name: Qualité et tests
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mmotors_test
          POSTGRES_USER: mmotors
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mmotors -d mmotors_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: frontend
      - run: mvn -B -ntp clean verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: tests-couverture-jar
          path: |
            backend/target/site/jacoco
            backend/target/surefire-reports
            backend/target/*.jar
      - name: Vérifier les mêmes contrats sur PostgreSQL
        run: mvn -B -ntp test -Dspring.datasource.url=jdbc:postgresql://localhost:5432/mmotors_test -Dspring.datasource.username=mmotors -Dspring.datasource.password=ci-only-password
        working-directory: backend
      - name: Démarrer l'application de test
        run: |
          DEMO_MODE=true ADMIN_PASSWORD=DemoAdmin2026! USER_PASSWORD=DemoClient2026! java -jar backend/target/m-motors-1.0.0.jar > application.log 2>&1 &
          for n in $(seq 1 40); do curl --fail http://localhost:8080/actuator/health && exit 0; sleep 2; done
          cat application.log
          exit 1
      - run: npx cypress install && npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-echec
          path: |
            application.log
            output/captures
